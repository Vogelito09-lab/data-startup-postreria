# Todo el sistema en local con un solo comando:   docker compose up --build
# S3 y SQS se emulan con moto; PostgreSQL corre en su contenedor. Nada de esto toca AWS.
# Tablero http://localhost:8501 · ingesta http://localhost:8000/docs · modelos http://localhost:8100/docs

x-aws: &aws
  AWS_ENDPOINT_URL: http://moto:5000
  AWS_ACCESS_KEY_ID: local
  AWS_SECRET_ACCESS_KEY: local
  AWS_DEFAULT_REGION: us-east-2
  BUCKET: data-startup-salome-13454721
  QUEUE_URL: http://moto:5000/123456789012/salome-pedidos

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: salome
      POSTGRES_USER: salome_admin
      POSTGRES_PASSWORD: ${PG_ADMIN_PASSWORD:-solo-local}
    volumes: [pgdatos:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salome_admin -d salome"]
      interval: 5s
      retries: 10

  moto:
    image: motoserver/moto:5.1.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/moto-api/', timeout=3)"]
      interval: 5s
      retries: 10

  init:
    build: {context: ., dockerfile: infra/docker/init.Dockerfile}
    environment:
      <<: *aws
      ADMIN_URL: postgresql://salome_admin:${PG_ADMIN_PASSWORD:-solo-local}@db:5432/salome
      PW_WORKER: ${PW_WORKER:-worker-local}
      PW_INGESTA: ${PW_INGESTA:-ingesta-local}
      PW_TABLERO: ${PW_TABLERO:-tablero-local}
    depends_on:
      db: {condition: service_healthy}
      moto: {condition: service_healthy}

  ingesta:
    build: {context: ., dockerfile: services/ingesta/Dockerfile}
    image: salome-ingesta:3
    environment:
      <<: *aws
      DATABASE_URL: postgresql://salome_ingesta:${PW_INGESTA:-ingesta-local}@db:5432/salome
    ports: ["8000:8000"]
    depends_on:
      init: {condition: service_completed_successfully}

  worker:
    build: {context: ., dockerfile: services/worker/Dockerfile}
    image: salome-worker:3
    environment:
      <<: *aws
      DATABASE_URL: postgresql://salome_worker:${PW_WORKER:-worker-local}@db:5432/salome
      ESPERA_COLA: "5"
    depends_on:
      init: {condition: service_completed_successfully}
    restart: unless-stopped

  modelos:
    build: {context: ., dockerfile: services/modelos/Dockerfile}
    image: salome-modelos:3
    environment:
      FUENTE: postgres
      DATABASE_URL: postgresql://salome_tablero:${PW_TABLERO:-tablero-local}@db:5432/salome
    ports: ["8100:8100"]
    depends_on:
      init: {condition: service_completed_successfully}

  tablero:
    build: {context: ., dockerfile: services/tablero/Dockerfile}
    image: salome-tablero:3
    environment:
      FUENTE: postgres
      DATABASE_URL: postgresql://salome_tablero:${PW_TABLERO:-tablero-local}@db:5432/salome
      MODELOS_URL: http://modelos:8100
    ports: ["8501:8501"]
    depends_on:
      modelos: {condition: service_started}

volumes:
  pgdatos:
