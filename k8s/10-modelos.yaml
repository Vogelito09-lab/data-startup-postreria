# API de modelos: Deployment (cuántas copias y cómo se revisan), Service (nombre fijo dentro del
# clúster que reparte el tráfico entre las copias) y HPA (agrega copias cuando sube el CPU).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: modelos
  namespace: salome
  labels: {app: modelos}
spec:
  replicas: 1
  selector:
    matchLabels: {app: modelos}
  template:
    metadata:
      labels: {app: modelos}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      containers:
        - name: modelos
          image: salome-modelos:3            # kind load docker-image salome-modelos:3 --name salome
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8100}]
          envFrom: [{configMapRef: {name: salome-config}}]
          resources:
            requests: {cpu: 250m, memory: 256Mi}   # el HPA calcula el % sobre este valor
            limits: {cpu: "1", memory: 1536Mi}   # con 768Mi y sin caché, 50 usuarios lo mataban por memoria (OOMKilled)
          readinessProbe:
            httpGet: {path: /salud, port: 8100}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /salud, port: 8100}
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4   # bajo carga la respuesta tarda; no reiniciar un pod que solo está ocupado
          volumeMounts:
            - {name: datos, mountPath: /datos, readOnly: true}
            - {name: tmp, mountPath: /tmp}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true}
      volumes:
        - name: datos
          hostPath: {path: /datos, type: Directory}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: modelos
  namespace: salome
spec:
  type: NodePort
  selector: {app: modelos}
  ports:
    - {port: 8100, targetPort: 8100, nodePort: 30100}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: modelos
  namespace: salome
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: modelos}
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 60}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120     # no quitar copias por un minuto tranquilo
