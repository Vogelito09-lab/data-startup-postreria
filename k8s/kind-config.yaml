# Clúster local de un nodo para E3:  kind create cluster --name salome --config k8s/kind-config.yaml
# Monta data/historial del repositorio en /datos del nodo (solo para el clúster local).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraMounts:
      - hostPath: ./data/historial
        containerPath: /datos
        readOnly: true
    extraPortMappings:
      - {containerPort: 30501, hostPort: 8501}
      - {containerPort: 30100, hostPort: 8100}
